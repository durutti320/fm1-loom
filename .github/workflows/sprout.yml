# SPROUT (Sound Garden on the M-VAVE FM-1, with SMALL AXE behind the grown-ups' menu), branch sprout: built on GitHub
# by the FM-1 community's shared builder (zvenson/fm1-build: JieLi's toolchain and the AC79 SDK, a signed build
# attestation). A push to sprout, or "Run workflow" on the Actions tab: the firmware as a downloadable artifact
# ("packages"), the browser emulator onto the branch sprout-emu, and every job's log onto sprout-ci-log.
name: SPROUT FM-1 firmware

on:
  push:
    branches: [sprout]
  workflow_dispatch:

permissions: {}

jobs:
  # SPROUT in the browser: fm1-base's emulator built with Emscripten (the FM-1, as LOOM-8's own page), onto the branch
  # sprout-emu as a website that can be served as it is
  emu:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Emscripten (emsdk 3.1.74) and Python (numpy, Pillow with raqm)
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.74 > /dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.74 > /dev/null
          sudo apt-get install -y -qq libfribidi0
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q numpy Pillow
      - name: Build
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" > /dev/null
          rc=0
          PYTHON="$RUNNER_TEMP/py/bin/python3" ./build.sh --web > /tmp/emu.log 2>&1 || rc=$?
          cat /tmp/emu.log
          if [ "$rc" != 0 ]; then
            echo "::error title=Emulator build failed::$(tail -n 60 /tmp/emu.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit "$rc"
          fi
      - name: Onto sprout-emu
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/emu"
          mkdir -p "$out"
          cp -R app/build/emu/. "$out"/
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b sprout-emu
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "SPROUT in the browser, from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sprout-emu

  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    with:
      sdk: true
      build: |
        rc=0
        bash -euo pipefail > /tmp/sp-build.log 2>&1 <<'EOF' || rc=$?
        # the builder checks out without submodules: fm1-base (base/) and its felucca-bsp (base/bsp/)
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        ./build.sh
        python3 tools/elf_funcs.py "$(ls app/build/*.elf | head -1)" || true
        mkdir -p build/sprout
        cp app/build/*.fwsc base/tools/fm1_install.py base/tools/fm1ports.py base/tools/fm1_backup.py build/sprout/
        cp app/build/*-res.bin build/sprout/ 2>/dev/null || true
        (cd build/sprout && PYTHONDONTWRITEBYTECODE=1 python3 fm1_install.py --help > /dev/null && rm -rf __pycache__)
        EOF
        cat /tmp/sp-build.log
        grep -E "image [0-9]+ B; RAM|^samples: |^font G" /tmp/sp-build.log | while read -r l; do
          echo "::notice title=Size::$l"
        done || true
        if [ "$rc" != 0 ]; then
          echo "::error title=Build failed::$(tail -n 60 /tmp/sp-build.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
          exit "$rc"
        fi
      packages: build/sprout/*
      test: |
        rc=0
        bash -euo pipefail > /tmp/sp-test.log 2>&1 <<'EOF' || rc=$?
        ./build.sh --host
        mkdir -p /tmp/sp-scenarios /tmp/l8-scenarios
        for s in tests/scenarios_sprout/*.xy; do app/build/host/sprout_host "$s" /tmp/sp-scenarios; done
        # LOOM-8's own scenarios, on the same build with SMALL AXE's workshop open from the start (SPROUT_SHOP=1)
        # (samples.xy and upload.xy need the user bank tests/run_tests.sh makes: the bank is LOOM-8's, unchanged;
        # bluetooth.xy connects to Bluetooth MIDI devices, which SPROUT builds without: fm1.toml ble_central)
        for s in tests/scenarios/*.xy; do case "$s" in */samples.xy|*/upload.xy|*/bluetooth.xy) continue;; esac; SPROUT_SHOP=1 app/build/host/sprout_host "$s" /tmp/l8-scenarios > /tmp/l8-one.log 2>&1 || { cat /tmp/l8-one.log; echo "FAILED: $s"; exit 1; }; done
        EOF
        cat /tmp/sp-test.log
        if [ "$rc" != 0 ]; then
          echo "::error title=Tests failed::$(tail -n 60 /tmp/sp-test.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
          exit "$rc"
        fi

  # the firmware onto the branch sprout-firmware too (the build's "packages", unzipped): a plain file to download and
  # install, beside the emulator's branch
  firmware:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: firmware
      - name: Onto sprout-firmware
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd firmware
          find . -mindepth 2 -type f -exec mv {} . \;           # (the artifact keeps build/sprout/: the files at the top)
          find . -mindepth 1 -type d -empty -delete
          ls -la
          printf 'SPROUT for the M-VAVE FM-1, built from %s\n\nInstall: python3 fm1_install.py sprout.fwsc (pip3 install mido python-rtmidi),\nwith the FM-1 on USB. Back up first: python3 fm1_backup.py backup mine.loom8 --magic LM8B\n' "$GITHUB_SHA" > README.txt
          git init -q -b sprout-firmware
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "SPROUT firmware, from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sprout-firmware

  # every job's log onto the branch sprout-ci-log (RESULT.txt: how each job ended), readable without the Actions page
  log:
    needs: [emu, build, firmware]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Onto sprout-ci-log
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: "emu=${{ needs.emu.result }} build=${{ needs.build.result }} firmware=${{ needs.firmware.result }}"
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          echo "$GITHUB_SHA $RESULTS" > RESULT.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
            --jq '.jobs[] | select(.name != "log") | "\(.id)\t\(.name)\t\(.conclusion)"' > jobs.tsv || true
          while IFS="$(printf '\t')" read -r id name concl; do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2> "job-$id.err" | tail -c 400000 > "job-$id.log" || true
            grep -E "image [0-9]+ B; RAM|^samples: |error|Error|FAIL" "job-$id.log" | head -60 > "job-$id-summary.txt" || true
          done < jobs.tsv
          git init -q -b sprout-ci-log
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$RESULTS ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sprout-ci-log
